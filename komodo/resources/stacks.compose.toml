[[stack]]
name = "trek"
description = "Self-hosted travel and trip planner."
tags = ["compose", "docker2", "travel", "ondra"]

[stack.config]
server = "docker2"
git_provider = "github.com"
git_account = "tvurci-skupina-betlem"
repo = "tvurci-skupina-betlem/oht-lab-docker"
branch = "main"
file_paths = ["compose.yml"]
run_directory = "stacks/trek"
environment = """
TZ=Europe/Prague
ENCRYPTION_KEY=[[TREK_ENCRYPTION_KEY]]
TREK_BIND_IP=192.168.50.202
TREK_PORT=3000
TREK_DATA_ROOT=/opt/appdata/trek
APP_URL=https://trek.betlem.cloud
ALLOWED_ORIGINS=https://trek.betlem.cloud
LOG_LEVEL=info
TRUST_PROXY=1
FORCE_HTTPS=false
OIDC_ISSUER=https://accounts.google.com
OIDC_CLIENT_ID=[[TREK_OIDC_CLIENT_ID]]
OIDC_CLIENT_SECRET=[[TREK_OIDC_CLIENT_SECRET]]
OIDC_DISPLAY_NAME="Google"
"""

[[stack]]
name = "netbox"
description = "Network source-of-truth and IPAM/DCIM platform."
tags = ["compose", "docker3", "network", "ipam", "docs", "infra", "ondra"]

[stack.config]
server = "docker3"
git_provider = "github.com"
git_account = "tvurci-skupina-betlem"
repo = "tvurci-skupina-betlem/oht-lab-docker"
branch = "main"
file_paths = ["compose.yml"]
run_directory = "stacks/netbox"
environment = """
TZ=Europe/Prague
TIME_ZONE=Europe/Prague
NETBOX_IMAGE_TAG=v4.7.4-5.1.1
NETBOX_BIND_IP=192.168.50.203
NETBOX_PORT=8000
NETBOX_APPDATA_ROOT=/mnt/cephfs/appdata/netbox
ALLOWED_HOSTS=netbox.betlem.cloud 192.168.50.203 localhost
DIODE_PLUGIN_VERSION=1.19.0
DIODE_TARGET_OVERRIDE=grpc://192.168.50.203:8080/diode
NETBOX_TO_DIODE_CLIENT_SECRET=[[DIODE_NETBOX_TO_DIODE_CLIENT_SECRET]]
POSTGRES_DB=netbox
POSTGRES_USER=netbox
POSTGRES_PASSWORD=[[NETBOX_POSTGRES_PASSWORD]]
REDIS_PASSWORD=[[NETBOX_REDIS_PASSWORD]]
REDIS_CACHE_PASSWORD=[[NETBOX_REDIS_CACHE_PASSWORD]]
SECRET_KEY=[[NETBOX_SECRET_KEY]]
API_TOKEN_PEPPER_1=[[NETBOX_API_TOKEN_PEPPER]]
SKIP_SUPERUSER=false
SUPERUSER_NAME=admin
SUPERUSER_EMAIL=admin@betlem.cloud
SUPERUSER_PASSWORD=[[NETBOX_SUPERUSER_PASSWORD]]
SUPERUSER_API_TOKEN=[[NETBOX_SUPERUSER_API_TOKEN]]
SUPERUSER_API_KEY=[[NETBOX_SUPERUSER_API_KEY]]
EMAIL_FROM=info@betlem.cloud
EMAIL_SERVER=mail-eu.smtp2go.com
EMAIL_PORT=2525
EMAIL_USERNAME=[[NETBOX_EMAIL_USERNAME]]
EMAIL_PASSWORD=[[NETBOX_EMAIL_PASSWORD]]
EMAIL_USE_SSL=false
EMAIL_USE_TLS=true
"""

