[[stack]]
name = "orb"
description = "NetBox Labs Orb network discovery agent."
tags = ["compose", "docker3", "network", "discovery", "netbox", "infra", "ondra"]

[stack.config]
server = "docker3"
git_provider = "github.com"
git_account = "tvurci-skupina-betlem"
repo = "tvurci-skupina-betlem/oht-lab-docker"
branch = "main"
file_paths = ["compose.yml"]
config_files = [
  { path = "config/agent.yaml", services = ["orb-agent"], requires = "Restart" },
]
run_directory = "stacks/orb"
environment = """
TZ=Europe/Prague
ORB_AGENT_IMAGE_TAG=2.17.0
ORB_AGENT_NAME=orb-docker3
ORB_APPDATA_ROOT=/mnt/cephfs/appdata/orb
ORB_SCAN_TARGETS=192.168.50.0/24
ORB_NETWORK_MASK=24
ORB_TENANT=Betlém
ORB_TENANT_GROUP=OHT IT Services
ORB_VRF=OHT-BETLEM
DIODE_DRY_RUN=false
DIODE_DRY_RUN_OUTPUT_DIR=/opt/orb/output
DIODE_TARGET=grpc://192.168.50.203:8080/diode
DIODE_CLIENT_ID=orb-docker3
DIODE_CLIENT_SECRET=[[DIODE_INGEST_ORB_DOCKER3_SECRET]]
"""

[[stack]]
name = "diode"
description = "NetBox Labs Diode ingestion service for Orb discovery data."
tags = ["compose", "docker3", "network", "netbox", "infra", "ondra"]

[stack.config]
server = "docker3"
git_provider = "github.com"
git_account = "tvurci-skupina-betlem"
repo = "tvurci-skupina-betlem/oht-lab-docker"
branch = "main"
file_paths = ["compose.yml"]
run_directory = "stacks/diode"
environment = """
TZ=Europe/Prague
DIODE_IMAGE_TAG=2.3.2
DIODE_BIND_IP=192.168.50.203
DIODE_PORT=8080
DIODE_APPDATA_ROOT=/opt/appdata/diode
DIODE_LOGGING_LEVEL=INFO
NETBOX_DIODE_PLUGIN_API_BASE_URL=http://192.168.50.203:8000/api/plugins/diode
DIODE_REDIS_PASSWORD=[[DIODE_REDIS_PASSWORD]]
DIODE_POSTGRES_ADMIN_PASSWORD=[[DIODE_POSTGRES_ADMIN_PASSWORD]]
DIODE_POSTGRES_PASSWORD=[[DIODE_POSTGRES_PASSWORD]]
DIODE_HYDRA_POSTGRES_PASSWORD=[[DIODE_HYDRA_POSTGRES_PASSWORD]]
DIODE_HYDRA_SECRETS_SYSTEM=[[DIODE_HYDRA_SECRETS_SYSTEM]]
DIODE_TO_NETBOX_CLIENT_SECRET=[[DIODE_TO_NETBOX_CLIENT_SECRET]]
NETBOX_TO_DIODE_CLIENT_SECRET=[[DIODE_NETBOX_TO_DIODE_CLIENT_SECRET]]
DIODE_INGEST_CLIENTS="orb-docker3=[[DIODE_INGEST_ORB_DOCKER3_SECRET]] orb-si-home=[[DIODE_INGEST_ORB_SI_HOME_SECRET]] orb-si-nas1=[[DIODE_INGEST_ORB_SI_NAS1_SECRET]]"
"""
