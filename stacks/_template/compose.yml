services:
  app:
    image: nginx:1.27-alpine
    container_name: oht-template-app
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Prague}
    ports:
      - "${APP_HTTP_PORT:-8080}:80"
    volumes:
      - app-data:/usr/share/nginx/html:ro
    networks:
      - app
    labels:
      oht.stack: template
      oht.owner: oht-lab

volumes:
  app-data:

networks:
  app:
    driver: bridge
