services:
  app:
    image: mauriceboe/trek:3.0.18
    container_name: trek
    read_only: true

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    cap_add:
      - CHOWN
      - SETUID
      - SETGID

    tmpfs:
      - /tmp:noexec,nosuid,size=64m

    ports:
      - "${TREK_BIND_IP:-127.0.0.1}:${TREK_PORT:-3000}:3000"

    environment:
      NODE_ENV: production
      PORT: 3000
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      TZ: ${TZ:-Europe/Prague}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      APP_URL: ${APP_URL:-}
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
      TRUST_PROXY: ${TRUST_PROXY:-1}

      # Optional OIDC / SSO
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_DISPLAY_NAME: ${OIDC_DISPLAY_NAME:-SSO}
      OIDC_ADMIN_CLAIM: ${OIDC_ADMIN_CLAIM:-groups}
      OIDC_ADMIN_VALUE: ${OIDC_ADMIN_VALUE:-app-trek-admins}

    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
