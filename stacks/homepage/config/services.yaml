- Network:
    - Pi-hole Primary:
        icon: pi-hole.png
        href: http://10.10.10.10/admin
        description: DNS and ad blocking (10.10.10.10)
        widget:
          type: pihole
          url: http://10.10.10.10
          version: 6
          key: "{{HOMEPAGE_VAR_PIHOLE_PRIMARY_KEY}}"
    - Pi-hole Secondary:
        icon: pi-hole.png
        href: http://10.10.10.11/admin
        description: DNS and ad blocking (10.10.10.11)
        widget:
          type: pihole
          url: http://10.10.10.11
          version: 6
          key: "{{HOMEPAGE_VAR_PIHOLE_SECONDARY_KEY}}"

- Operations:
    - Uptime Kuma:
        icon: uptime-kuma.png
        href: https://uptimekuma.betlem.cloud
        description: Service uptime monitoring
        widget:
          type: uptimekuma
          url: http://192.168.50.202:3001
          slug: "{{HOMEPAGE_VAR_UPTIMEKUMA_SLUG}}"
    - GitHub Repository:
        icon: github.png
        href: https://github.com/tvurci-skupina-betlem/oht-lab-docker
        description: Docker stack definitions for Komodo GitOps

- Reference:
    - Homepage Docs:
        icon: homepage.png
        href: https://gethomepage.dev/
        description: Dashboard documentation
    - OHT-LAB Docs:
        icon: mdi-book-open-page-variant
        href: https://github.com/tvurci-skupina-betlem/oht-lab-docker/tree/main/docs
        description: Operations notes

- ArrStuff:
    - qBittorrent:
        icon: qbittorrent
        href: http://oht-nas1:6363
        description: qBittorrent on OHT-NAS1
        widget:
          type: qbittorrent
          url: http://oht-nas1:6363
          username: "{{HOMEPAGE_VAR_QBITTORRENT_USERNAME}}"
          password: "{{HOMEPAGE_VAR_QBITTORRENT_PASSWORD}}"
          enableLeechProgress: true
          enableLeechSize: true
