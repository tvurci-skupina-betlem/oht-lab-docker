- Platform:
    - Komodo:
        icon: komodo.png
        href: https://komodo.betlem.cloud
        description: Docker operations control plane
        widget:
          type: komodo
          url: http://192.168.50.202:9120
          key: "{{HOMEPAGE_VAR_KOMODO_KEY}}"
          secret: "{{HOMEPAGE_VAR_KOMODO_SECRET}}"
          showStacks: true
          fields: ["total", "running", "down", "unhealthy"]
    - NetBox:
        icon: netbox.png
        href: https://netbox.betlem.cloud
        description: Network source of truth
    - TREK:
        icon: mdi-map-marker-path
        href: https://trek.betlem.cloud
        description: Travel and trip planner

- Proxmox:
    - Proxmox Cluster:
        icon: proxmox.png
        href: https://lab.betlem.cloud
        description: Virtualization cluster
        widget:
          type: proxmox
          url: "{{HOMEPAGE_VAR_PROXMOX_URL}}"
          username: "{{HOMEPAGE_VAR_PROXMOX_USERNAME}}"
          password: "{{HOMEPAGE_VAR_PROXMOX_PASSWORD}}"
          fields: ["vms", "lxc", "resources.cpu", "resources.mem"]
    - pve1:
        icon: proxmox.png
        href: https://lab.betlem.cloud
        description: Proxmox node
        widget:
          type: proxmox
          url: "{{HOMEPAGE_VAR_PROXMOX_URL}}"
          username: "{{HOMEPAGE_VAR_PROXMOX_USERNAME}}"
          password: "{{HOMEPAGE_VAR_PROXMOX_PASSWORD}}"
          node: pve1
          fields: ["vms", "lxc", "resources.cpu", "resources.mem"]
