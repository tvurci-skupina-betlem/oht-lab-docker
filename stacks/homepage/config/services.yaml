- Home:
    - Home Assistant:
        icon: home-assistant.png
        href: https://ha.betlem.cloud
        description: Home automation (HA OS VM 303 on pve3)
        widget:
          type: homeassistant
          url: https://ha.betlem.cloud
          key: "{{HOMEPAGE_VAR_HOMEASSISTANT_TOKEN}}"

- Platform:
    - TREK:
        icon: mdi-map-marker-path
        href: https://trek.betlem.cloud
        description: Travel and trip planner
    - Vaultwarden:
        icon: vaultwarden.png
        href: https://vault.betlem.cloud
        description: Password manager (docker3)
        siteMonitor: https://vault.betlem.cloud/alive

- Infra:
    - Proxmox:
        - Proxmox Cluster:
            icon: proxmox.png
            href: https://lab.betlem.cloud
            description: Virtualization cluster
            widget:
              type: proxmox
              url: "{{HOMEPAGE_VAR_PROXMOX_URL}}"
              username: "{{HOMEPAGE_VAR_PROXMOX_USERNAME}}"
              password: "{{HOMEPAGE_VAR_PROXMOX_PASSWORD}}"
              fields: ["vms", "lxc", "resources.cpu", "resources.mem"]
        - pve1:
            icon: proxmox.png
            href: https://192.168.50.101:8006
            description: Proxmox node
            widget:
              type: proxmox
              url: "{{HOMEPAGE_VAR_PROXMOX_URL}}"
              username: "{{HOMEPAGE_VAR_PROXMOX_USERNAME}}"
              password: "{{HOMEPAGE_VAR_PROXMOX_PASSWORD}}"
              node: pve1
              fields: ["vms", "lxc", "resources.cpu", "resources.mem"]
        - pve2:
            icon: proxmox.png
            href: https://192.168.50.102:8006
            description: Proxmox node
            widget:
              type: proxmox
              url: "{{HOMEPAGE_VAR_PROXMOX_URL}}"
              username: "{{HOMEPAGE_VAR_PROXMOX_USERNAME}}"
              password: "{{HOMEPAGE_VAR_PROXMOX_PASSWORD}}"
              node: pve2
              fields: ["vms", "lxc", "resources.cpu", "resources.mem"]
        - pve3:
            icon: proxmox.png
            href: https://192.168.50.103:8006
            description: Proxmox node
            widget:
              type: proxmox
              url: "{{HOMEPAGE_VAR_PROXMOX_URL}}"
              username: "{{HOMEPAGE_VAR_PROXMOX_USERNAME}}"
              password: "{{HOMEPAGE_VAR_PROXMOX_PASSWORD}}"
              node: pve3
              fields: ["vms", "lxc", "resources.cpu", "resources.mem"]
        - pve4:
            icon: proxmox.png
            href: https://192.168.50.104:8006
            description: Proxmox node
            widget:
              type: proxmox
              url: "{{HOMEPAGE_VAR_PROXMOX_URL}}"
              username: "{{HOMEPAGE_VAR_PROXMOX_USERNAME}}"
              password: "{{HOMEPAGE_VAR_PROXMOX_PASSWORD}}"
              node: pve4
              fields: ["vms", "lxc", "resources.cpu", "resources.mem"]

    - Servers:
        - OHT-LAB5:
        - OHT-Ragnar:
        - OHT-AI1:

    - Operations:
        - Uptime Kuma:
            icon: uptime-kuma.png
            href: https://uptimekuma.betlem.cloud
            description: Service uptime monitoring
            widget:
              type: uptimekuma
              url: https://uptimekuma.betlem.cloud
              slug: "{{HOMEPAGE_VAR_UPTIMEKUMA_SLUG}}"
        - Komodo:
            icon: komodo.png
            href: https://komodo.betlem.cloud
            description: Docker operations control plane
            widget:
              type: komodo
              url: https://komodo.betlem.cloud
              key: "{{HOMEPAGE_VAR_KOMODO_KEY}}"
              secret: "{{HOMEPAGE_VAR_KOMODO_SECRET}}"
              showStacks: true
              fields: ["total", "running", "down", "unhealthy"]
        - Dockge:
            icon: dockge.png
            href: https://dockge.betlem.cloud
            description: Compose stack manager on docker2
            siteMonitor: https://dockge.betlem.cloud
        - NetBox:
            icon: netbox.png
            href: https://netbox.betlem.cloud
            description: Network source of truth

    - Network:
        - Caddy:
            icon: caddy.png
            description: Reverse proxy and TLS
            widget:
              type: caddy
              url: http://192.168.50.115:2020
        - Pi-hole Primary:
            icon: pi-hole.png
            href: https://10.10.10.10/admin
            description: DNS and ad blocking (10.10.10.10)
            widget:
              type: pihole
              url: https://10.10.10.10
              version: 6
              key: "{{HOMEPAGE_VAR_PIHOLE_PRIMARY_KEY}}"
        - Pi-hole Secondary:
            icon: pi-hole.png
            href: https://10.10.10.11/admin
            description: DNS and ad blocking (10.10.10.11)
            widget:
              type: pihole
              url: https://10.10.10.11
              version: 6
              key: "{{HOMEPAGE_VAR_PIHOLE_SECONDARY_KEY}}"
        - Tailscale:
            icon: tailscale.png
            href: https://console.tailscale.com
            description: Subnet router and exit node (oht-lab-tailscale-ha-exit)
            widget:
              type: tailscale
              deviceid: nU4c3FP9K211CNTRL
              key: "{{HOMEPAGE_VAR_TAILSCALE_API_KEY}}"
        - Cloudflare Tunnel:
            icon: cloudflare.png
            href: https://dash.cloudflare.com
            description: cloudflared-primary and cloudflared-secondary
            widget:
              type: cloudflared
              accountid: 1d1c8fcebc488c0e576676b9650fd2de
              tunnelid: 6c94dc9c-621c-4d8c-bafa-4e8578f6d224
              key: "{{HOMEPAGE_VAR_CLOUDFLARE_API_TOKEN}}"

- Reference:
    - Homepage Docs:
        icon: homepage.png
        href: https://gethomepage.dev/
        description: Dashboard documentation
    - OHT-LAB Docs:
        icon: github
        href: https://github.com/tvurci-skupina-betlem/oht-lab-docker/tree/main/docs
        description: Git-Opes single source of truth and notes

- ArrStuff:
    - qBittorrent:
        icon: qbittorrent
        href: https://qbittorrent.betlem.cloud
        description: qBittorrent on OHT-NAS1
        widget:
          type: qbittorrent
          url: https://qbittorrent.betlem.cloud
          username: "{{HOMEPAGE_VAR_QBITTORRENT_USERNAME}}"
          password: "{{HOMEPAGE_VAR_QBITTORRENT_PASSWORD}}"
          enableLeechProgress: true
          enableLeechSize: true
