services:
  orb-agent:
    image: docker.io/netboxlabs/orb-agent:${ORB_AGENT_IMAGE_TAG:-2.17.0}
    container_name: orb-agent
    restart: unless-stopped
    network_mode: host
    user: "0:0"
    # Docker's own init replaces the image's tini, whose path differs between
    # image versions.
    init: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # render-config.sh fills ${VAR} placeholders in agent.yaml, then runs the
    # stock entrypoint with the rendered config.
    entrypoint:
      - /bin/sh
      - /opt/orb/render-config.sh
    command:
      - run
      - -c
      - /tmp/agent.yaml
    environment:
      TZ: ${TZ:-Europe/Prague}
      DIODE_TARGET: ${DIODE_TARGET:-grpc://192.168.50.203:8080/diode}
      DIODE_CLIENT_ID: ${DIODE_CLIENT_ID:-}
      DIODE_CLIENT_SECRET: ${DIODE_CLIENT_SECRET:-}
      DIODE_DRY_RUN: ${DIODE_DRY_RUN:-true}
      DIODE_DRY_RUN_OUTPUT_DIR: ${DIODE_DRY_RUN_OUTPUT_DIR:-/opt/orb/output}
      ORB_AGENT_NAME: ${ORB_AGENT_NAME:-orb-docker3}
      # Per-site discovery scope. ORB_SCAN_TARGETS is a comma-separated list
      # of IPs, ranges or CIDRs; ORB_TENANT is the NetBox tenant for results.
      ORB_SCAN_TARGETS: ${ORB_SCAN_TARGETS:-192.168.50.0/24}
      ORB_NETWORK_MASK: ${ORB_NETWORK_MASK:-24}
      ORB_TENANT: ${ORB_TENANT:-Betlém}
      ORB_TENANT_GROUP: ${ORB_TENANT_GROUP:-OHT IT Services}
      ORB_VRF: ${ORB_VRF:-OHT-BETLEM}
      ORB_SCAN_SCHEDULE: ${ORB_SCAN_SCHEDULE:-0 */6 * * *}
      ORB_SCAN_TIMEOUT: ${ORB_SCAN_TIMEOUT:-10}
    volumes:
      - ./config/agent.yaml:/opt/orb/agent.yaml.tmpl:ro
      - ./render-config.sh:/opt/orb/render-config.sh:ro
      - "${ORB_APPDATA_ROOT:-/mnt/cephfs/appdata/orb}/output:/opt/orb/output:rw"
    labels:
      oht.stack: orb
      oht.owner: oht-lab
