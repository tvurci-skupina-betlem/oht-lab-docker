# Template: the dollar-brace placeholders below are filled from the container
# environment by render-config.sh at startup. Orb itself does not expand them.
# Do not write that placeholder syntax in comments; it is substituted too.
orb:
  config_manager:
    active: local

  backends:
    common:
      diode:
        target: "${DIODE_TARGET}"
        client_id: "${DIODE_CLIENT_ID}"
        client_secret: "${DIODE_CLIENT_SECRET}"
        agent_name: "${ORB_AGENT_NAME}"
        dry_run: ${DIODE_DRY_RUN}
        dry_run_output_dir: "${DIODE_DRY_RUN_OUTPUT_DIR}"
    network_discovery:
      log_level: INFO
      log_format: JSON

  policies:
    network_discovery:
      lan_discovery:
        config:
          schedule: "${ORB_SCAN_SCHEDULE}"
          timeout: ${ORB_SCAN_TIMEOUT}
          defaults:
            description: "Discovered by Orb network discovery"
            comments: "Observed by Orb Agent ${ORB_AGENT_NAME}"
            # Tenant and VRF must match NetBox exactly (name and group), and
            # both tenant copies must be identical, or Diode creates duplicates.
            tenant:
              name: "${ORB_TENANT}"
              group: "${ORB_TENANT_GROUP}"
            vrf:
              name: "${ORB_VRF}"
              tenant:
                name: "${ORB_TENANT}"
                group: "${ORB_TENANT_GROUP}"
            tags:
              - orb
              - network-discovery
            network_mask: ${ORB_NETWORK_MASK}
        scope:
          # Flow list, filled from a comma-separated env value.
          targets: [${ORB_SCAN_TARGETS}]
          fast_mode: true
          timing: 4
          max_retries: 1
